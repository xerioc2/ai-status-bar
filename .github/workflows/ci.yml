name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Extension host (minimum supported VS Code)
        run: xvfb-run -a npm run test:extension
      - name: Extension host (current stable VS Code)
        run: xvfb-run -a npm run test:extension
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ai-status-bar-vsix
          path: '*.vsix'
